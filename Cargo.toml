[workspace]
resolver = "2"
members = ["crates/core", "crates/worker"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Size-focused settings recommended by Cloudflare for Rust Workers.
[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "s"
