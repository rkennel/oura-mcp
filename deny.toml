# cargo-deny: checks dependencies for known vulnerabilities, unexpected
# licences and untrusted sources. Run with `scripts/static-analysis.sh`.

[advisories]
yanked = "deny"

[licenses]
# Test-only dependencies are skipped by default; audit them too.
include-dev = true
# Explicit allowlist: a dependency with any other licence fails the check
# and has to be added here deliberately.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Unicode-3.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
