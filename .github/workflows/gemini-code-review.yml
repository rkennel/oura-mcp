name: Google Gemini CLI Code Review
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Number of the pull request to review'
        required: true
        type: string
  pull_request:
    types: [opened, synchronize, reopened]

# A new push to the same pull request cancels the review still running for
# the previous push, so reviews do not stack up.
concurrency:
  group: gemini-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

# How it works: tools/gemini-review fetches the pull request and writes it,
# with a line-numbered diff, to .gemini-review/. CI's static analysis, unit
# tests and scripts/check-standards.sh then run on the pull request, and
# `gemini-review facts` writes how they ended, the coverage of internal/ by
# package and the changed internal/ files with no test change to
# .gemini-review/facts.md. The tool picks the model by
# the rules in .github/gemini-review.json: a pull request with enough changed
# lines, a critical path or a changed exported API of a shared package goes
# to the high-risk model. Any other is triaged by the triage model, which can
# escalate it, and otherwise goes to the standard model. Gemini reads the
# pull request, the facts and the repository with read-only tools and no
# GitHub token, and replies with its review as JSON, with a verdict on every
# rule of GEMINI.md that the standards check does not own. Those steps live
# in .github/actions/gemini-review, which the seeded-defect run
# (gemini-review-eval.yml) shares. tools/gemini-review then checks from
# Gemini CLI's statistics that the chosen model answered and that the
# checklist covers every rule, adds the standards check's verdicts and
# findings, and posts the review, with the checklist and which model reviewed
# and why, as one review by github-actions[bot]. The check is green only when
# a review was posted: a Gemini error, a reply that is not a review or omits
# a rule, a fallback to another model or a refused post turns it red. On a
# pull request with nothing to fix, the review says "No issues found."
#
# The review runs only on pull requests from this repository's own branches.
# It builds and runs the pull request's code with the Gemini key and a token
# that can write, so a fork's code must never reach it, including when
# someone starts the review by hand. The origin job checks first, with no
# secrets and a read-only token, and the review job is skipped unless the
# head branch is in this repository; the origin job's summary says why.
# pull_request_target is not used: it would hand a fork's run the secrets.
jobs:
  origin:
    name: Check where the pull request comes from
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      same_repo: ${{ steps.origin.outputs.same_repo }}
    steps:
      # The default ref: on a manual run, the branch the workflow was started
      # from, which is in this repository; on a pull_request run, the pull
      # request's merge commit. A fork's pull_request run gets no secrets and
      # a read-only token, so its code running here reaches nothing.
      - name: Checkout the workflow's commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/gemini-review/go.mod
          cache: false

      - name: Build the review tool
        working-directory: tools/gemini-review
        run: go build -o "${RUNNER_TEMP}/gemini-review" .

      # Asks GitHub for the pull request's head repository, so a manual run,
      # which knows only the number, is checked the same way.
      - name: Check the pull request's head repository
        id: origin
        run: '"${RUNNER_TEMP}/gemini-review" origin'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}

  review:
    needs: origin
    if: needs.origin.outputs.same_repo == 'true'
    runs-on: ubuntu-latest
    # Gemini took about seven minutes on the first runs; the facts add the
    # static analysis and unit tests.
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      REVIEW_DIR: ${{ github.workspace }}/.gemini-review
    steps:
      - name: Checkout the pull request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The head commit, so the files Gemini reads match the diff's
          # right-hand line numbers. No token is left in .git for it to find.
          ref: refs/pull/${{ github.event.pull_request.number || inputs.pr_number }}/head
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The facts run the server's static analysis and unit tests, so the
          # Go version and cache follow the server's module, as in CI.
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            scripts/static-analysis.sh

      - name: Test and build the review tool
        working-directory: tools/gemini-review
        run: |
          go test -race ./...
          go build -o "${RUNNER_TEMP}/gemini-review" .

      - name: Prepare the pull request for Gemini
        run: '"${RUNNER_TEMP}/gemini-review" prepare'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Gemini cannot run the tests or measure coverage with read-only tools,
      # so CI's own stage scripts work these out first, without the Gemini
      # key or a token, and leave them in .gemini-review/facts.md. A failing
      # stage is a fact for the review, not a reason to stop it.
      - name: Work out the facts Gemini reviews with
        run: |
          scripts/review-facts.sh
          "${RUNNER_TEMP}/gemini-review" facts

      - name: Review with Gemini
        id: review
        uses: ./.github/actions/gemini-review
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          tool: ${{ runner.temp }}/gemini-review
          pr_number: ${{ github.event.pull_request.number || inputs.pr_number }}
          upload_artifacts: 'true'

      - name: Post the review
        run: '"${RUNNER_TEMP}/gemini-review" post'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_REPLY: ${{ steps.review.outputs.reply }}
          GEMINI_OUTPUT: ${{ steps.review.outputs.cli_output }}
