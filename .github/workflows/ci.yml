name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Third-party actions are pinned to commit SHAs; the comment gives the version.
# The Go version comes from go.mod, so local runs and CI use the same one.
jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The script pins the linter versions, so a version bump there
          # starts a fresh cache of their modules and builds.
          cache-dependency-path: scripts/static-analysis.sh
      - run: scripts/static-analysis.sh

  unit-tests:
    name: Unit tests and coverage
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: scripts/unit-test.sh

  end-to-end:
    name: End-to-end tests
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Buildx and the runtime token let Docker read and write the Actions cache.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      # The local start and stop scripts, run against a copy of the repository.
      - run: scripts/server-scripts-test.sh
      - run: scripts/e2e-test.sh
        env:
          COMPOSE_FILE: e2e/compose.yaml:e2e/compose.ci.yaml
