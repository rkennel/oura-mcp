# CI-only override: stores image layers in the GitHub Actions cache so the
# end-to-end stage does not rebuild unchanged layers on every run.
services:
  server:
    build:
      cache_from:
        - type=gha,scope=e2e-server
      cache_to:
        - type=gha,scope=e2e-server,mode=max
  fakeoura:
    build:
      cache_from:
        - type=gha,scope=e2e-fakeoura
      cache_to:
        - type=gha,scope=e2e-fakeoura,mode=max
